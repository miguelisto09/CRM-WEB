<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 200px;
            background-color: #800080;
            padding: 20px;
            height: 100vh;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .sidebar a:hover {
            background-color: #9932CC;
        }
        .sidebar a.active {
            background-color: #9932CC;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .actions-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .actions button, .actions input {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .actions button {
            background-color: #800080;
            color: white;
        }
        .actions button:hover {
            background-color: #9932CC;
        }
        .actions button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .actions input {
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            max-width: 500px;
            border-radius: 15px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .selected {
            background-color: #d1c4e9 !important;
        }
        .details {
            position: absolute;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: none;
            z-index: 2;
        }
        .modal-content input[type="text"], .modal-content select {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 25px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        .modal-content button {
            width: 100%;
            background-color: #800080;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-content button:hover {
            background-color: #9932CC;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="#">Inicio</a>
        <a href="#" class="active">Clientes</a>
        <a href="#">Tareas</a>
        <a href="#">Recordatorios</a>
    </div>
    <div class="content">
        <h1>Clientes</h1>
        <div class="actions-container">
            <div class="actions">
                <button onclick="openModal('addModal')">Agregar</button>
                <button id="editButton" onclick="openModal('editModal')" disabled>Editar</button>
                <button id="deleteButton" onclick="openModal('deleteModal')" disabled>Eliminar</button>
            </div>
            <input type="text" id="buscar" placeholder="Buscar..." onkeyup="filtrarClientes()">
        </div>
        <table id="tablaClientes">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se agregarán las filas de los clientes -->
            </tbody>
        </table>

        <!-- Modal para agregar cliente -->
        <div id="addModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('addModal')">&times;</span>
                <h2>Agregar Cliente</h2>
                <label for="addNombre">Nombre:</label>
                <input type="text" id="addNombre"><br><br>
                <label for="addEmail">Email:</label>
                <input type="text" id="addEmail"><br><br>
                <label for="addTelefono">Teléfono:</label>
                <input type="text" id="addTelefono"><br><br>
                <label for="addDireccion">Dirección:</label>
                <input type="text" id="addDireccion"><br><br>
                <label for="addEstado">Estado:</label>
                <select id="addEstado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select><br><br>
                <button onclick="agregarCliente()">Agregar</button>
            </div>
        </div>

        <!-- Modal para editar cliente -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('editModal')">&times;</span>
                <h2>Editar Cliente</h2>
                <label for="editNombre">Nombre:</label>
                <input type="text" id="editNombre"><br><br>
                <label for="editEmail">Email:</label>
                <input type="text" id="editEmail"><br><br>
                <label for="editTelefono">Teléfono:</label>
                <input type="text" id="editTelefono"><br><br>
                <label for="editDireccion">Dirección:</label>
                <input type="text" id="editDireccion"><br><br>
                <label for="editEstado">Estado:</label>
                <select id="editEstado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select><br><br>
                <button onclick="editarCliente()">Editar</button>
            </div>
        </div>

        <!-- Modal para eliminar cliente -->
        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('deleteModal')">&times;</span>
                <h2>Eliminar Cliente</h2>
                <p>¿Está seguro de que desea eliminar este cliente?</p>
                <button onclick="eliminarCliente()">Eliminar</button>
            </div>
        </div>

        <!-- Detalles del cliente -->
        <div id="detallesCliente" class="details">
            <h2>Detalles del Cliente</h2>
            <p><strong>Nombre:</strong> <span id="detalleNombre"></span></p>
            <p><strong>Email:</strong> <span id="detalleEmail"></span></p>
            <p><strong>Teléfono:</strong> <span id="detalleTelefono"></span></p>
            <p><strong>Dirección:</strong> <span id="detalleDireccion"></span></p>
            <p><strong>Estado:</strong> <span id="detalleEstado"></span></p>
            <p><strong>Notas:</strong> <span id="detalleNotas"></span></p>
        </div>
    </div>

    <script>
        let selectedRows = [];

        function openModal(modalId) {
            document.getElementById(modalId).style.display = "block";
            if (modalId === 'editModal' && selectedRows.length === 1) {
                const selectedRow = selectedRows[0];
                document.getElementById('editNombre').value = selectedRow.cells[0].innerText;
                document.getElementById('editEmail').value = selectedRow.cells[1].innerText;
                document.getElementById('editTelefono').value = selectedRow.cells[2].innerText;
                document.getElementById('editDireccion').value = selectedRow.cells[3].innerText;
                document.getElementById('editEstado').value = selectedRow.cells[4].innerText;
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function agregarCliente() {
            const nombre = document.getElementById("addNombre").value;
            const email = document.getElementById("addEmail").value;
            const telefono = document.getElementById("addTelefono").value;
            const direccion = document.getElementById("addDireccion").value;
            const estado = document.getElementById("addEstado").value;
            if (nombre && email && telefono && direccion && estado) {
                const table = document.getElementById("tablaClientes").getElementsByTagName('tbody')[0];
                const newRow = table.insertRow();
                newRow.insertCell(0).innerText = nombre;
                newRow.insertCell(1).innerText = email;
                newRow.insertCell(2).innerText = telefono;
                newRow.insertCell(3).innerText = direccion;
                newRow.insertCell(4).innerText = estado;
                newRow.onmouseover = (event) => mostrarDetallesCliente(event, newRow);
                newRow.onmouseout = ocultarDetallesCliente;
                newRow.onclick = () => selectRow(newRow);
                closeModal('addModal');
            }
        }

        function editarCliente() {
            if (selectedRows.length === 1) {
                const selectedRow = selectedRows[0];
                const nombre = document.getElementById("editNombre").value;
                const email = document.getElementById("editEmail").value;
                const telefono = document.getElementById("editTelefono").value;
                const direccion = document.getElementById("editDireccion").value;
                const estado = document.getElementById("editEstado").value;
                if (nombre) selectedRow.cells[0].innerText = nombre;
                if (email) selectedRow.cells[1].innerText = email;
                if (telefono) selectedRow.cells[2].innerText = telefono;
                if (direccion) selectedRow.cells[3].innerText = direccion;
                if (estado) selectedRow.cells[4].innerText = estado;
                closeModal('editModal');
            } else {
                alert("Seleccione un cliente para editar.");
            }
        }

        function eliminarCliente() {
            if (selectedRows.length > 0) {
                selectedRows.forEach(row => row.remove());
                selectedRows = [];
                closeModal('deleteModal');
                document.getElementById('editButton').disabled = true;
                document.getElementById('deleteButton').disabled = true;
                document.getElementById('detallesCliente').style.display = 'none';
            } else {
                alert("Seleccione al menos un cliente para eliminar.");
            }
        }

        function filtrarClientes() {
            const input = document.getElementById("buscar");
            const filter = input.value.toLowerCase();
            const table = document.getElementById("tablaClientes");
            const tr = table.getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName("td");
                let showRow = false;
                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        const txtValue = td[j].textContent || td[j].innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            showRow = true;
                            break;
                        }
                    }
                }
                tr[i].style.display = showRow ? "" : "none";
            }
        }

        function selectRow(row) {
            if (selectedRows.includes(row)) {
                row.classList.remove('selected');
                selectedRows = selectedRows.filter(r => r !== row);
            } else {
                row.classList.add('selected');
                selectedRows.push(row);
            }
            document.getElementById('editButton').disabled = selectedRows.length !== 1;
            document.getElementById('deleteButton').disabled = selectedRows.length === 0;
        }

        function mostrarDetallesCliente(event, row) {
            const detalles = document.getElementById('detallesCliente');
            document.getElementById('detalleNombre').innerText = row.cells[0].innerText;
            document.getElementById('detalleEmail').innerText = row.cells[1].innerText;
            document.getElementById('detalleTelefono').innerText = row.cells[2].innerText;
            document.getElementById('detalleDireccion').innerText = row.cells[3].innerText;
            document.getElementById('detalleEstado').innerText = row.cells[4].innerText;
            detalles.style.display = 'block';
            detalles.style.top = event.clientY + 'px';
            detalles.style.left = event.clientX + 'px';
        }

        function ocultarDetallesCliente() {
            document.getElementById('detallesCliente').style.display = 'none';
        }

        document.querySelectorAll('#tablaClientes tbody tr').forEach(row => {
            row.onmouseover = (event) => mostrarDetallesCliente(event, row);
            row.onmouseout = ocultarDetallesCliente;
            row.onclick = () => selectRow(row);
        });
    </script>
</body>
</html>
