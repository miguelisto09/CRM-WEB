<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; 
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group input {
            width: 80%;
            padding: 10px;
            padding-left: 40px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .input-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #34495e;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        .login-container button:hover {
            background-color: #2c3e50;
        }
        .login-container .register-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #34495e;
            text-decoration: none; 
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="nombre_usuario" placeholder="Usuario" required>
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="contraseña" placeholder="Contraseña" required>
        </div>
        <button id="loginButton">Iniciar Sesión</button>
        <a href="registrar.html" class="register-link">¿No tienes una cuenta? Regístrate</a>
    </div>
    <script>
        document.getElementById("loginButton").addEventListener("click", async () => {
            const nombre_usuario = document.getElementById("nombre_usuario").value;
            const contraseña = document.getElementById("contraseña").value;

            if (!nombre_usuario || !contraseña) {
                alert("❌ Por favor, complete todos los campos.");
                return;
            }

            const usuario = { nombre_usuario, contraseña };

            try {
                const response = await fetch("http://localhost:4000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(usuario)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Error desconocido");
                }

                const data = await response.json();
                alert("✅ Inicio de sesión exitoso.");
                // Guardar el token en el almacenamiento local o en una cookie
                localStorage.setItem("token", data.token);
                // Redirigir a la página principal o a la página de inicio
                window.location.href = "inicio.html"; 

            } catch (error) {
                console.error("❌ Error en el inicio de sesión:", error);
                alert("❌ Error al iniciar sesión: " + error.message);
            }
        });
    </script>
</body>
</html>
