    <style>

        .container {

        .sidebar {

            color: white;

            top: 0;
            left: 0;
            padding: 20px;

            transition: width 0.3s, padding 0.3s, opacity 0.3s; /* Unified transition duration */

        .sidebar.collapsed {
            width: 83px;
            padding: 20px 10px;
        }

        .sidebar h2, .sidebar ul li a span {
            transition: opacity 0.3s, width 0.3s; /* Unified transition duration */
            opacity: 1;
            width: auto;
        }

        .sidebar.collapsed h2, .sidebar.collapsed ul li a span {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar.collapsed ul li a {

            padding: 10px 0;
        }

        .sidebar.collapsed ul li a i {

        }

        .sidebar.collapsed .Cerrarsesion {

        }

        .toggle-btn {

            color: white;
            border: none;
            border-radius: 50%;

            height: 40px;

            align-items: center;
            justify-content: center;

            transform: translateY(-50%);
        }

        .sidebar.collapsed .toggle-btn {
            right: -20px;
        }

        .toggle-btn i {

        }

        .sidebar.collapsed .toggle-btn i {

        }

        .main-content {
            margin-left: 0px;

        }

        .main-content.collapsed {

        }

        .sidebar h2 {
            margin: 0;

        }

        .sidebar ul {

        }

    <script>
    // Array de tareas
    var tasks = [];

    // Actualiza el elemento con id "datetime" para mostrar la fecha y hora actual
    function updateDateTime() {
        const now = new Date();
        document.getElementById('datetime').innerText = now.toLocaleString();
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    

    // Función para obtener las tareas del servidor
    function fetchTasks() {
        fetch('http://localhost:4000/tarea')
            .then(response => response.json())
            .then(data => {
                tasks = data;
                updateTaskCategories();
            })
            .catch(error => {
                console.error('Error al obtener tareas:', error);
            });
    }

    

    // Función que organiza las tareas en categorías según su fecha de vencimiento
    function updateTaskCategories() {
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        var tasksByDueDate = {
            "Atrasadas": tasks.filter(task => {
                if (!task.fecha_limite) return false;
                var dueDate = new Date(task.fecha_limite);
                var dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
                return dueDateOnly < today && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada;
            }),
            "Para Hoy": tasks.filter(task => {
                if (!task.fecha_limite) return false;
                var dueDate = new Date(task.fecha_limite);
                var dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
                return dueDateOnly.getTime() === today.getTime() && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada;
            }),
            "Para Esta Semana": tasks.filter(task => {
                if (!task.fecha_limite) return false;
                var dueDate = new Date(task.fecha_limite);
                var dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
                var weekFromNow = new Date(today);
                weekFromNow.setDate(today.getDate() + 7);
                return dueDateOnly > today && dueDateOnly <= weekFromNow && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada;
            }),
            "Para la Próxima Semana": tasks.filter(task => {
                if (!task.fecha_limite) return false;
                var dueDate = new Date(task.fecha_limite);
                var dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
                var weekFromNow = new Date(today);
                weekFromNow.setDate(today.getDate() + 7);
                var twoWeeksFromNow = new Date(today);
                twoWeeksFromNow.setDate(today.getDate() + 14);
                return dueDateOnly > weekFromNow && dueDateOnly <= twoWeeksFromNow && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada;
            }),
            "Dentro de Dos Semanas o Más": tasks.filter(task => {
                if (!task.fecha_limite) return false;
                var dueDate = new Date(task.fecha_limite);
                var dueDateOnly = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
                var twoWeeksFromNow = new Date(today);
                twoWeeksFromNow.setDate(today.getDate() + 14);
                return dueDateOnly > twoWeeksFromNow && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada;
            }),
            "Sin Fecha Límite": tasks.filter(task => !task.fecha_limite && task.estado !== 'Completada' && task.estado !== 'realizada' && !task.enviada)
        };

        var taskCategories = document.getElementById('taskCategories');
        taskCategories.innerHTML = '';

        for (var category in tasksByDueDate) {
            var categoryDiv = document.createElement('div');
            categoryDiv.className = 'task-category';
            categoryDiv.innerHTML = `<h3>${category}</h3>`;
            tasksByDueDate[category].forEach(task => {
                var taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                var dueDateClass = new Date(task.fecha_limite) < new Date() ? 'overdue' : 'on-time';
                var dueDateText = '';
                var dueDate = new Date(task.fecha_limite);
                var formattedDate = `${dueDate.getDate()}/${dueDate.getMonth() + 1}/${dueDate.getFullYear().toString().slice(-2)}`;
                if (dueDate.getTime() === today.getTime()) {
                    dueDateText = 'Venciendo: ';
                    dueDateClass = 'due-today'; // Add a new class for tasks due today
                } else {
                    dueDateText = dueDate < new Date() ? 'Venció: ' : 'Vence: ';
                }
                taskDiv.innerHTML = `
                    <p class="title">${task.nombre_tarea}</p>
                    <p class="description">${task.descripcion}</p>
                    <p class="due-date ${dueDateClass}"><em>${dueDateText} ${formattedDate}</em></p>
                    <button class="delete-btn" onclick="confirmDeleteTask(${task.id_tarea})"><i class="fas fa-trash-alt"></i></button>
                `;
                taskDiv.addEventListener('click', function() {
                    openTaskModal(task);
                });
                categoryDiv.appendChild(taskDiv);
            });
            taskCategories.appendChild(categoryDiv);
        }
    }

    function openTaskModal(task) {
        var modal = document.getElementById('taskModal');
        modal.innerHTML = `

                <hr style="margin-bottom: 30px;">
                <form id="taskForm">
                    <div style="margin-bottom: 20px;">
                        <label for="submissionText" style="display:block; margin-bottom:8px;"><strong>Escribe tu respuesta:</strong></label>
                        <textarea id="submissionText" style="
                            width: 100%;
                            height: 150px;
                            border-radius: 8px;

                            border: 1px solid #ccc;
                            resize: vertical;
                        " placeholder="Escribe aquí..."></textarea>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label for="fileUpload" style="display:block; margin-bottom:8px;"><strong>Subir Archivo:</strong></label>
                        <input type="file" id="fileUpload" style="
                            width: 100%;

                            border: 1px solid #ccc;
                            border-radius: 8px;
                        ">
                    </div>
                    <div id="previousSubmission" style="margin-bottom: 20px; display: none;">
                        <h3>Envío Anterior</h3>
                        <p id="previousText"></p>
                        <a id="previousFile" href="#" target="_blank">Ver Archivo Subido</a>
                    </div>
                    <div>
                        <button type="submit" id="submitTaskButton" style="
                            padding: 12px 24px;
                            border: none;
                            background: #28a745;
                            color: #fff;
                            border-radius: 8px;
                            cursor: pointer;
                            font-size: 16px;
                        ">Enviar Tarea</button>
                    </div>
                </form>
            </div>
        `;
        modal.style.display = 'block';

        document.getElementById('modalClose').addEventListener('click', closeTaskModal);

        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleSubmitTask(task);
        });

        // Fetch previous submission if exists
        fetch(`/envio_tarea?id_tarea=${task.id_tarea}&id_empleado=1`) // Assuming employeeId is 1
            .then(response => response.json())
            .then(data => {
                if (data) {
                    document.getElementById('previousSubmission').style.display = 'block';
                    document.getElementById('previousText').textContent = data.texto_envio;
                    document.getElementById('previousFile').href = `/descargar_archivo?id_envio=${data.id_envio}`;
                    document.getElementById('previousFile').textContent = data.nombre_archivo;
                }
            })
            .catch(error => {
                console.error('Error al obtener el envío anterior:', error);
            });

        // Disable submission if the task is overdue and not re-enabled by admin
        if (new Date(task.fecha_limite) < new Date().setHours(0, 0, 0, 0) && !task.habilitada) {
            document.getElementById('submitTaskButton').disabled = true;
            document.getElementById('submitTaskButton').textContent = 'Tarea Vencida';
            document.getElementById('submitTaskButton').style.backgroundColor = '#ccc';
            document.getElementById('submitTaskButton').style.cursor = 'not-allowed';
            document.getElementById('submissionText').disabled = true;
            document.getElementById('fileUpload').disabled = true;
        }
    }

    function closeTaskModal() {
        var modal = document.getElementById('taskModal');
        modal.style.display = 'none';
    }

    function handleSubmitTask(task) {
        var submissionText = document.getElementById('submissionText').value;
        var fileInput = document.getElementById('fileUpload');
        var file = fileInput.files[0];

        var employeeId = 1; 

        var formData = new FormData();
        formData.append('taskId', task.id_tarea);
        formData.append('employeeId', employeeId); 
        formData.append('submissionText', submissionText || ''); 
        if (file) {
            formData.append('file', file); 
        }

        fetch('http://localhost:4000/submitTask', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            alert('Tarea enviada correctamente');
            closeTaskModal();
            // Update the task status to "realizada" in the database
            fetch(`http://localhost:4000/updateTaskStatus?id_tarea=${task.id_tarea}&estado=Realizada`, {
                method: 'PUT'
            })
            .then(response => response.json())
            .then(data => {
                // Remove the submitted task from the tasks array
                tasks = tasks.filter(t => t.id_tarea !== task.id_tarea);
                updateTaskCategories(); // Refresh task categories to remove the submitted task from the list
            })
            .catch(error => {
                console.error('Error al actualizar el estado de la tarea:', error);
            });
        })
        .catch(error => {
            console.error('Error al enviar la tarea:', error);
            alert('Error al enviar la tarea');
        });
    }

    function confirmDeleteTask(taskId) {
        if (confirm("¿Desea eliminar esta tarea?")) {
            deleteTask(taskId);
        }
    }

    function deleteTask(taskId) {
        fetch(`http://localhost:4000/tarea/${taskId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            alert('Tarea eliminada correctamente');
            tasks = tasks.filter(t => t.id_tarea !== taskId);
            updateTaskCategories();
        })
        .catch(error => {
            console.error('Error al eliminar la tarea:', error);
            alert('Error al eliminar la tarea');
        });
    }

    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const mainContent = document.querySelector('.main-content');
        const toggleBtn = document.querySelector('.toggle-btn i');
        const optionNames = document.querySelectorAll('.sidebar h2, .sidebar ul li a span');
        const icons = document.querySelectorAll('.sidebar ul li a i, .toggle-btn i');

        if (sidebar.classList.contains('collapsed')) {
            optionNames.forEach(name => {
                name.style.opacity = '0';
            });
            icons.forEach(icon => {
                icon.style.opacity = '0';
            });
            setTimeout(() => {
                sidebar.classList.remove('collapsed');
                mainContent.classList.remove('collapsed');
                toggleBtn.classList.remove('collapsed');
                setTimeout(() => {
                    optionNames.forEach(name => {
                        name.style.display = 'inline';
                        setTimeout(() => {
                            name.style.opacity = '1';
                        }, 10); // Small delay to trigger opacity transition
                    });
                    icons.forEach(icon => {
                        icon.style.opacity = '1';
                    });
                }, 300); // Match the transition duration
            }, 300); // Match the transition duration
        } else {
            optionNames.forEach(name => {
                name.style.opacity = '0';
            });
            icons.forEach(icon => {
                icon.style.opacity = '0';
            });
            setTimeout(() => {
                optionNames.forEach(name => {
                    name.style.display = 'none';
                });
                sidebar.classList.add('collapsed');
                mainContent.classList.add('collapsed');
                toggleBtn.classList.add('collapsed');
                setTimeout(() => {
                    icons.forEach(icon => {
                        icon.style.opacity = '1';
                    });
                }, 10); // Small delay to trigger opacity transition
            }, 300); // Match the transition duration
        }
    }

    window.addEventListener('click', function(event) {
        var modal = document.getElementById('taskModal');
        if (event.target === modal) {
            closeTaskModal();
        }
    });

    window.onload = fetchTasks;
</script>
    
</body>
</html>
