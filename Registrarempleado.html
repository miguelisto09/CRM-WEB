<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Registrar empleado</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; 
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            text-align: center;
            transition: width 0.3s, padding 0.3s, opacity 0.3s; /* Unified transition duration */
        }

        .sidebar.collapsed {
            width: 60px;
            padding: 20px 10px;
        }

        .sidebar h2, .sidebar ul li a span {
            transition: opacity 0.3s, width 0.3s; /* Unified transition duration */
            opacity: 1;
            width: auto;
        }

        .sidebar.collapsed h2, .sidebar.collapsed ul li a span {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        .sidebar.collapsed ul li a {
            text-align: center;
            padding: 10px 0;
        }

        .sidebar.collapsed ul li a i {
            transition: opacity 0.3s; /* Add transition for icons */
            margin-right: 0;
        }

        .sidebar.collapsed .Cerrarsesion {
            width: 60px;
            text-align: center;
            padding: 10px 0;
        }

        .toggle-btn {
            position: absolute;
            top: 50%;
            right: -20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: right 0.3s, transform 0.3s; /* Unified transition duration */
            z-index: 1000; /* Ensure the button is always on top */
            transform: translateY(-50%);
        }

        .sidebar.collapsed .toggle-btn {
            right: -20px;
        }

        .toggle-btn i {
            transition: transform 0.3s; /* Unified transition duration */
        }

        .sidebar.collapsed .toggle-btn i {
            transform: rotate(180deg);
        }

        .main-content {
            margin-left: 270px;
            transition: margin-left 0.3s; /* Unified transition duration */
        }

        .main-content.collapsed {
            margin-left: 80px;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 28px;
            text-align: center;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            padding-left: 0;
            text-align: left;
        }

        .sidebar ul li {
            margin: 10px 0;
            font-size: 18px;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s; /* Unified transition duration */
        }

        .sidebar ul li a:hover {
            background-color: #34495e;
        }

        .Cerrarsesion {
            position: fixed;
            bottom: 0;
            align-items: center;
            text-align: center;
            width: 250px;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 0 0 5px 5px;
            transition: background-color 0.3s, width 0.3s, padding 0.3s, opacity 0.3s; /* Unified transition duration */
        }

        .main-content {
            margin-left: 270px;
            padding: 20px;
           
        }

        .Verempleados {
            max-width: 100%;
            margin: 20px auto;
            padding: 20px;
            overflow-x: auto; /* Allow horizontal scrolling if needed */
        }

        .Verempleados table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #fff; 
            table-layout: auto; /* Allow table to adjust based on content */
        }

        table, th, td {
            border: 1px solid #ddd; /* Add border to table, th, and td */
        }

        table th, table td {
            text-align: left; /* Align text to the left */
            padding: 8px; /* Reduce padding */
            border-bottom: 1px solid #ddd;
            font-size: 0.9em; /* Reduce font size */
            white-space: normal; /* Allow text to wrap */
            word-wrap: break-word; /* Ensure text wraps within the cell */
        }

        table thead {
            background-color: #3498db;
            color: #fff;
        }

        table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table tbody tr:hover {
            background-color: #f5f5f5;
        }

        table tbody td {
            text-align: left; /* Align text to the left */
            font-family: 'Franklin Gothic Medium Cond';
            white-space: nowrap; /* Prevent text from wrapping */
            overflow: hidden; /* Hide overflow */
            text-overflow: ellipsis; /* Add ellipsis for overflow text */
        }

        table button {
            padding: 4px 2px; /* Reduce padding */
            background-color: #34495e;
            color: #fff;
            border: none;
            border-radius: 4px;
            margin: 0 2px;
            cursor: pointer;
            font-size: 0.8em; /* Reduce font size */
            width: 50px; /* Reduce width */
        }

        table button:hover {
            background-color: #2c3e50;
        }

        table button:last-child:hover {
            background-color: #c0392b;
        }

        .wrap-text {
            font-size: 0.8em; /* Reduce font size */
            word-wrap: break-word;
            white-space: normal;
            max-height: 3em; /* Allow up to two lines of text */
            overflow-y: auto; /* Add vertical scroll for long text */
        }

        .input-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 5px;
            background-color: #fff;
            position: relative;
        }

        .input-container i {
            color: gray;
            margin-left: 5px;
        }

        .Buscar {
            border: none;
            outline: none;
            flex: 1;
            padding-left: 5px;
            height: 25px;
            font-size: 14px;
        }

        .alinear {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 99%;
        }

        .alinear h2 {
            margin: 0;
            font-size: 24px;
            flex: 1;
        }

        

        .Registro {
            padding: 10px;
            background-color: #34495e;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            white-space: nowrap;
        }

       

        @media (min-width: 768px) {
            .alinear {
                flex-direction: row;
                justify-content: space-between;
            }

            .Registro {
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) {
            .Verempleados table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .Verempleados table th, .Verempleados table td {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" style="background-color: #2c3e50;">
        <h2>Bienvenido usuario</h2>
        <ul>
            <li><a href="inicio.html"><i class="fas fa-home"></i> <span>Inicio</span></a></li>
            <li><a href="Tareas.html"><i class="fas fa-tasks"></i> <span>Tareas</span></a></li>
            <li><a href="Registrarempleado.html"><i class="fas fa-users"></i> <span>Empleados</span></a></li>
            <li><a href="Configuracion.html"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
            <li><a href="Recordatorio.html"><i class="fas fa-bell"></i> <span>Recordatorios</span></a></li>
        </ul>
        <ul>
            <li class="Cerrarsesion"><a href="login.html"><i class="fas fa-sign-out"></i> <span>Cerrar sesión</span></a></li>
        </ul>
        <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-chevron-left"></i></button>
    </div> 
    <div class="main-content">
        <div class="Verempleados">
            <div class="alinear">
                <button class="Registro" onclick="registrarEmpleado()">+ Nuevo empleado</button>
                <div class="input-container-wrapper">
                    <div class="input-container">
                        <input id="buscar-empleado" class="Buscar" type="search" placeholder="Buscar empleado">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <td>Nombre</td>
                        <td>Apellido</td>
                        <td>Fecha de nacimiento</td>
                        <td>Correo electrónico</td>
                        <td>Cédula</td>
                        <td>Teléfono</td>
                        <td>Dirección</td>
                        <td>Cargo</td>
                        <td>Salario</td>
                        <td>Estado</td>
                        <td>Nota</td>
                        <td>Acciones</td>
                    </tr>
                </thead>
                <tbody id="tabla-empleados"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarEmpleados() {
            try {
                const response = await fetch('http://localhost:4000/empleado'); 
                const empleados = await response.json();
                const tabla = document.getElementById('tabla-empleados');
                tabla.innerHTML = ''; 

                empleados.forEach(emp => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${emp.nombre}</td>
                        <td>${emp.apellido}</td>
                        <td>${new Date(emp.fecha_nacimiento).toISOString().split('T')[0]}</td>
                        <td class="wrap-text">${emp.correo_electronico || 'N/A'}</td>
                        <td class="wrap-text">${emp.cedula || 'N/A'}</td>
                        <td class="wrap-text">${emp.telefono || 'N/A'}</td>
                        <td class="wrap-text">${emp.direccion || 'N/A'}</td>
                        <td class="wrap-text">${emp.cargo || 'N/A'}</td>
                        <td class="wrap-text">${emp.salario || 'N/A'}</td>
                        <td class="wrap-text">${emp.estado || 'N/A'}</td>
                        <td class="wrap-text">${emp.notas || 'N/A'}</td>
                        <td>
                            <button onclick="editarEmpleado(${emp.id_empleado})">Editar</button>
                            <button onclick="eliminarEmpleado(${emp.id_empleado})">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar empleados:', error);
            }
        }

        function filtrarEmpleados() {
            const input = document.getElementById('buscar-empleado');
            const filtro = input.value.toUpperCase();
            const tabla = document.getElementById('tabla-empleados');
            const filas = tabla.getElementsByTagName('tr');

            for (let i = 0; i < filas.length; i++) {
                const celdas = filas[i].getElementsByTagName('td');
                let coincide = false;
                for (let j = 0; j < celdas.length; j++) {
                    if (celdas[j]) {
                        const texto = celdas[j].textContent || celdas[j].innerText;
                        if (texto.toUpperCase().indexOf(filtro) > -1) {
                            coincide = true;
                            break;
                        }
                    }
                }
                filas[i].style.display = coincide ? '' : 'none';
            }
        }

        document.getElementById('buscar-empleado').addEventListener('input', filtrarEmpleados);

        async function eliminarEmpleado(id) {
            if (confirm('¿Estás seguro de eliminar este empleado?')) {
                try {
                    await fetch(`http://localhost:4000/empleado/${id}`, { method: 'DELETE' });
                    cargarEmpleados();
                } catch (error) {
                    console.error('Error al eliminar empleado:', error);
                }
            }
        }

        function editarEmpleado(id) {
            window.location.href = `editarEmpleado.html?id=${id}`;
        }

        function registrarEmpleado() {
            window.location.href = `registrarempleadoo.html`;
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.querySelector('.toggle-btn i');
            const optionNames = document.querySelectorAll('.sidebar h2, .sidebar ul li a span');
            const icons = document.querySelectorAll('.sidebar ul li a i, .toggle-btn i');

            if (sidebar.classList.contains('collapsed')) {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    sidebar.classList.remove('collapsed');
                    mainContent.classList.remove('collapsed');
                    toggleBtn.classList.remove('collapsed');
                    setTimeout(() => {
                        optionNames.forEach(name => {
                            name.style.display = 'inline';
                            setTimeout(() => {
                                name.style.opacity = '1';
                            }, 10); // Small delay to trigger opacity transition
                        });
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 300); // Match the transition duration
                }, 300); // Match the transition duration
            } else {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    optionNames.forEach(name => {
                        name.style.display = 'none';
                    });
                    sidebar.classList.add('collapsed');
                    mainContent.classList.add('collapsed');
                    toggleBtn.classList.add('collapsed');
                    setTimeout(() => {
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 10); 
                }, 300); 
            }
        }
        document.addEventListener('DOMContentLoaded', cargarEmpleados);
    </script>
</body>
</html>
