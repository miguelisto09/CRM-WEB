<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Registrar empleado</title>
    <header>
        <h1>Gestión de empleados</h1>
            <ul>
            <li><a href="inicio.html"><i class="fas fa-home"></i>   Inicio</a></li>
            <li><a href="Tareas.html"><i class="fas fa-tasks"></i>  Tareas</a></li>
            <li><a href="Registrarempleado.html"><i class="fas fa-users"></i>  Empleados</a></li>
            <li><a href="Configuracion.html"><i class="fas fa-cog"></i>  Configuración</a></li>
            <li><a href="Recordatorio.html"><i class="fas fa-bell"></i>  Recordatorios</a></li>
            </ul>
    </header>
</head>
<body>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; 
        }
        header {
            background-color: #34495e;
            color: white;
            padding: 10px;

        }
        header li {
            display: inline;
            margin: 0 10px;
        }
        header h1 {
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header ul {
            list-style: none;
            padding: 0;
            text-align: right;
        }
        header a {
            color: white;
            text-decoration: none;
        }
        header a:hover {
            text-decoration: underline;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 400px;
            margin: auto;
            margin-top: 20px;;
        }
        form h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;        
        }
        .input-group input {
            width: 80%;
            padding: 10px;
            padding-left: 40px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .input-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            align-self: center;
                
        }
        form button {
            width: 100%;
            padding: 10px;
            background-color: #34495e;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #34495e;
        }
        .Verempleados {
            margin: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table td, table th {
            border: 1px solid #ccc;
            padding: 10px;
        }
        table thead {
            background-color: #3498db;
            color: white;
        }
        table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        table tbody tr:hover {
            background-color: #f1f1f1;
        }
        table tbody td {
            text-align: center;
            font-family: 'Franklin Gothic Medium Cond';
        }
        table tbody td button {
            padding: 5px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 5px;
            size: 10px;
            width: 90px;
        }
        
        table tbody td button:hover {
            background-color: #2c3e50;
        }
        table tbody td button + button:hover {
            background-color: #c0392b;
        }
        .Verempleados button {
            padding: 10px;
            background-color: #34495e;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
        } 
        .Verempleados{
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    .input-container {
        display: flex;
        align-items: center;
        width: 250px; 
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 5px;
        background-color: white;
        margin: 0 10px;
    }

    .input-container i {
        color: gray;
        margin-left: 5px;
    }

    .Buscar {
        border: none;
        outline: none;
        flex: 1;
        padding-left: 5px;
        height: 30px;
        font-size: 16px;
    }
    .alinear {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    </style>
    <form> 
        <h2>Registrar empleados</h2>
        <div class="input-group">
            <input type="text" placeholder="Nombre">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Apellido">
        </div>
        <div class="input-group">
            <input type="date" placeholder="Fecha de nacimiento">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Correo electrónico">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Cédula">        
        </div>
        <div class="input-group">
            <input type="text" placeholder="Teléfono">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Dirección">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Cargo">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Estado">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Nota">
        </div>

        <button>Registrar</button>
    </form>
    <div class="Verempleados">
        <table>
            <div class="alinear">
                <h2>Empleados</h2>
                <div class="input-container">
                    <input class="Buscar" type="search" placeholder="Buscar empleado">
                    <i class="fas fa-search"></i>
                </div>
            <thead>
                <td>Nombre</td>
                <td>Apellido</td>
                <td>Fecha de nacimiento</td>
                <td>Correo electrónico</td>
                <td>Cédula</td>
                <td>Teléfono</td>
                <td>Dirección</td>
                <td>Cargo</td>
                <td>Estado</td>
                <td>Nota</td>
                <td>Acciones</td>
            </tr>
            </thead>
            <tbody id="tabla-empleados"></tbody>
            </table>
    </div>
                
    <script>
        async function cargarEmpleados() {
            try {
                const response = await fetch('http://localhost:4000/empleado');
                const empleados = await response.json();
                const tabla = document.getElementById('tabla-empleados');
                tabla.innerHTML = '';

                empleados.forEach(emp => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${emp.nombre}</td>
                        <td>${emp.apellido}</td>
                        <td>${emp.fecha_nacimiento}</td>
                        <td>${emp.correo_electronico || 'N/A'}</td>
                        <td>${emp.cedula || 'N/A'}</td>
                        <td>${emp.telefono || 'N/A'}</td>
                        <td>${emp.direccion || 'N/A'}</td>
                        <td>${emp.cargo || 'N/A'}</td>
                        <td>${emp.estado || 'N/A'}</td>
                        <td>${emp.notas || 'N/A'}</td>
                        <td>
                            <button onclick="editarEmpleado(${emp.id_empleado})">Editar</button>
                            <button onclick="eliminarEmpleado(${emp.id_empleado})">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar empleados:', error);
            }
        }

        async function eliminarEmpleado(id) {
            if (confirm('¿Estás seguro de eliminar este empleado?')) {
                try {
                    await fetch(`http://localhost:4000/empleado/${id}`, { method: 'DELETE' });
                    cargarEmpleados(); 
                } catch (error) {
                    console.error('Error al eliminar empleado:', error);
                }
            }
        }

        function editarEmpleado(id) {
            alert('Función de edición en desarrollo para ID ' + id);
        }

        document.addEventListener('DOMContentLoaded', cargarEmpleados);
    </script>
    </body>
    
</html>
