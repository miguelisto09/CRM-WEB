<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración del Manejador de Tareas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="estilo.css">
    <style>
        .config-section {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .config-section h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .config-section label {
            display: block;
            margin-bottom: 10px;
        }
        .config-section input, .config-section select, .config-section textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .config-section .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .config-section .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        .config-buttons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .config-buttons .btn {
            flex: 1 1 48%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: transparent;
            color: #333;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .config-buttons .btn:hover {
            background-color: #f4f4f4;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .config-sidebar {
            width: 20%;
            float: left;
            background-color: #f4f4f4;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .config-sidebar ul {
            list-style: none;
            padding: 0;
        }
        .config-sidebar ul li {
            margin-bottom: 10px;
        }
        .config-sidebar ul li a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .config-sidebar ul li a:hover {
            background-color: #ddd;
        }
        .config-content {
            width: 75%;
            float: right;
            padding: 20px;
        }
        .config-section {
            display: none;
        }
        .config-section.active {
            display: block;
        }
        .config-container {
            display: flex;
            justify-content: space-between;
        }
        .config-sidebar {
            width: 20%;
            background-color: #f4f4f4;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .config-content {
            width: 75%;
            padding: 20px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('.config-sidebar ul li a');
            const sections = document.querySelectorAll('.config-section');
            const themeSelect = document.getElementById('theme');
            const languageSelect = document.getElementById('language');
            const timezoneSelect = document.getElementById('timezone');
            const datetimeFormatSelect = document.getElementById('datetimeFormat');
            const notificationsCheckbox = document.getElementById('notifications');
            const fontSizeSelect = document.getElementById('fontSize');
            const interfaceModeSelect = document.getElementById('interfaceMode');
            const messageBox = document.createElement('div');
            messageBox.id = 'messageBox';
            messageBox.style.display = 'none';
            messageBox.style.position = 'fixed';
            messageBox.style.top = '10px';
            messageBox.style.left = '50%';
            messageBox.style.transform = 'translateX(-50%)';
            messageBox.style.padding = '10px';
            messageBox.style.backgroundColor = '#4caf50';
            messageBox.style.color = '#fff';
            messageBox.style.borderRadius = '5px';
            document.body.appendChild(messageBox);

            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));

                    sections.forEach(section => section.classList.remove('active'));
                    target.classList.add('active');
                });
            });

            // Activate the first section by default
            if (sections.length > 0) {
                sections[0].classList.add('active');
            }

            // Load current configuration
            fetch('/configuracion?id_usuario=1')
                .then(response => response.json())
                .then(data => {
                    themeSelect.value = data.tema || '';
                    languageSelect.value = data.idioma || '';
                    timezoneSelect.value = data.zona_horaria || '';
                    datetimeFormatSelect.value = data.formato_fecha_hora || '';
                    notificationsCheckbox.checked = data.notificaciones || false;
                    fontSizeSelect.value = data.tamano_fuente || '';
                    interfaceModeSelect.value = data.modo_interfaz || '';
                    applyTheme(data.tema);
                    applyConfiguration(data);
                });

            // Save configuration
            document.querySelector('.config-buttons .btn').addEventListener('click', function() {
                const config = {
                    id_usuario: 1,
                    idioma: languageSelect.value || null,
                    zona_horaria: timezoneSelect.value || null,
                    formato_fecha_hora: datetimeFormatSelect.value || null,
                    notificaciones: notificationsCheckbox.checked ? 1 : 0,
                    tema: themeSelect.value || null,
                    tamano_fuente: fontSizeSelect.value || null,
                    modo_interfaz: interfaceModeSelect.value || null
                };
                fetch('/configuracion', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                })
                .then(response => response.json())
                .then(data => {
                    showMessage('Configuración guardada correctamente');
                    applyTheme(config.tema);
                    applyConfiguration(config);
                })
                .catch(error => {
                    console.error('Error al guardar configuración:', error);
                });
            });

            function showMessage(message) {
                messageBox.textContent = message;
                messageBox.style.display = 'block';
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 3000);
            }

            function applyTheme(theme) {
                document.body.className = theme;
                const sidebar = document.querySelector('.sidebar');
                sidebar.className = `sidebar ${theme}`;
            }

            function applyConfiguration(config) {
                document.getElementById('language').value = config.idioma || '';
                document.getElementById('timezone').value = config.zona_horaria || '';
                document.getElementById('datetimeFormat').value = config.formato_fecha_hora || '';
                document.getElementById('notifications').checked = config.notificaciones || false;
                document.getElementById('theme').value = config.tema || '';
                document.getElementById('fontSize').value = config.tamano_fuente || '';
                document.getElementById('interfaceMode').value = config.modo_interfaz || '';
            }
        });
    </script>
</head>
<body>
    <div class="sidebar">
        <h2>Bienvenido usuario</h2>
        <ul>
            <li><a href="inicio.html"><i class="fas fa-home"></i>   Inicio</a></li>
            <li><a href="tareas.html"><i class="fas fa-tasks"></i>  Tareas</a></li>
            <li><a href="Registrarempleado.html"><i class="fas fa-users"></i>  Empleados</a></li>
            <li><a href="Configuracion.html"><i class="fas fa-cog"></i>  Configuración</a></li>
            <li><a href="Recordatorio.html"><i class="fas fa-bell"></i>  Recordatorios</a></li>
            <li class="Cerrarsesion"><a href="login.html"><i class="fas fa-sign-out"></i> Cerrar sesión</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Configuración del Manejador de Tareas</h1>
        </div>

        <div class="config-container">
            <div class="config-sidebar">
                <ul>
                    <li><a href="#general">Configuración General</a></li>
                    
                    
                    <li><a href="#interface">Configuración de la Interfaz</a></li>
              
                </ul>
            </div>

            <div class="config-content">
                <div id="general" class="config-section">
                    <h2>1. Configuración General</h2>
                    <label for="language">Idioma</label>
                    <select id="language">
                        <option value="es">Español</option>
                        <option value="en">Inglés</option>
                    </select>
                    <label for="timezone">Zona horaria</label>
                    <select id="timezone">
                        <option value="gmt-5">GMT-5</option>
                        <option value="gmt-6">GMT-6</option>
                    </select>
                    <label for="datetimeFormat">Formato de fecha y hora</label>
                    <select id="datetimeFormat">
                        <option value="dd/mm/yyyy">DD/MM/AAAA</option>
                        <option value="mm/dd/yyyy">MM/DD/AAAA</option>
                    </select>
                    <div class="checkbox-group">
                        <input type="checkbox" id="notifications">
                        <label for="notifications">Notificaciones</label>
                    </div>
                    <label for="theme">Tema</label>
                    <select id="theme">
                        <option value="light">Modo claro</option>
                        <option value="dark">Modo oscuro</option>
                    </select>
                </div>

                

             


                <div id="interface" class="config-section">
                    <h2>8. Configuración de la Interfaz</h2>
                    <label for="fontSize">Tamaño de fuentes y accesibilidad</label>
                    <select id="fontSize">
                        <option value="small">Pequeño</option>
                        <option value="medium">Mediano</option>
                        <option value="large">Grande</option>
                    </select>
                    <label for="iconCustomization">Personalización de iconos y colores</label>
                    <textarea id="iconCustomization" placeholder="Definir personalización..."></textarea>
                    <label for="interfaceMode">Modo de interfaz</label>
                    <select id="interfaceMode">
                        <option value="compact">Compacto</option>
                        <option value="expanded">Expandido</option>
                    </select>
                </div>

                <div class="config-buttons">
                    <button class="btn">✔ Guardar cambios</button>
                    <button class="btn">❌ Cancelar</button>
                    <button class="btn">🔄 Restaurar valores predeterminados</button>
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
