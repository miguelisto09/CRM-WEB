<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Permisos de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="estilo.css">
    <style>
        .config-section {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .config-section h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .config-section label {
            display: block;
            margin-bottom: 10px;
        }
        .config-section input, .config-section select, .config-section textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .config-section .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .config-section .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        .config-buttons {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .config-buttons .btn {
            flex: 1 1 48%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: transparent;
            color: #333;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .config-buttons .btn:hover {
            background-color: #f4f4f4;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .config-sidebar {
            width: 20%;
            float: left;
            background-color: #f4f4f4;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .config-sidebar ul {
            list-style: none;
            padding: 0;
        }
        .config-sidebar ul li {
            margin-bottom: 10px;
        }
        .config-sidebar ul li a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .config-sidebar ul li a:hover {
            background-color: #ddd;
        }
        .config-content {
            width: 75%;
            float: right;
            padding: 20px;
        }
        .config-section {
            display: none;
        }
        .config-section.active {
            display: block;
        }
        .config-container {
            display: flex;
            justify-content: space-between;
        }
        .config-sidebar {
            width: 20%;
            background-color: #f4f4f4;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        .config-content {
            width: 75%;
            padding: 20px;
        }
        .user-list {
            margin-top: 20px; /* Adjust this value as needed */
        }
        .user-list table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-list th, .user-list td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .user-list th {
            background-color: #f4f4f4;
        }
        .user-list tr:hover {
            background-color: #ddd;
        }
        .user-list tr.selected {
            background-color: #b3d9ff;
        }
        .user-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: -30px; /* Adjust this value as needed */
        }
        .user-actions button, .user-actions i {
            background-color: transparent;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2em;
            color: #333;
            transition: color 0.3s, background-color 0.3s;
            border-radius: 10px;
            padding: 5px;
        }
        .user-actions button:hover, .user-actions i:hover {
            color: #007bff;
            background-color: rgba(0, 0, 0, 0.1);
        }
        .btn-select {
            font-size: 0.9em;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('.config-sidebar ul li a');
            const sections = document.querySelectorAll('.config-section');
            const messageBox = document.createElement('div');
            messageBox.id = 'messageBox';
            messageBox.style.display = 'none';
            messageBox.style.position = 'fixed';
            messageBox.style.top = '10px';
            messageBox.style.left = '50%';
            messageBox.style.transform = 'translateX(-50%)';
            messageBox.style.padding = '10px';
            messageBox.style.backgroundColor = '#4caf50';
            messageBox.style.color = '#fff';
            messageBox.style.borderRadius = '5px';
            document.body.appendChild(messageBox);

            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));

                    sections.forEach(section => section.classList.remove('active'));
                    target.classList.add('active');
                });
            });

            // Activate the first section by default
            if (sections.length > 0) {
                sections[0].classList.add('active');
            }

            const userList = document.querySelector('.user-list table tbody');
            let currentUserId = null;

            // Fetch and display users
            fetch('/usuarios')
                .then(response => response.json())
                .then(users => {
                    if (users.length === 0) {
                        console.error('No se encontraron usuarios.');
                        return;
                    }
                    users.forEach(user => {
                        const userRow = document.createElement('tr');
                        userRow.dataset.userId = user.id_usuario;
                        userRow.innerHTML = `
                            <td>${user.Nombre_usuario}</td>
                            <td>${user.Contraseña}</td>
                            <td>${user.Rol}</td>
                        `;
                        userList.appendChild(userRow);
                    });

                    // Add click event to user rows
                    userList.querySelectorAll('tr').forEach(row => {
                        row.addEventListener('click', function() {
                            userList.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
                            this.classList.add('selected');
                            currentUserId = this.dataset.userId;
                            loadUserPermissions(currentUserId);
                        });
                    });
                })
                .catch(error => {
                    console.error('Error al obtener usuarios:', error);
                });

            function loadUserPermissions(userId) {
                fetch(`/configuracion?id_usuario=${userId}`)
                    .then(response => response.json())
                    .then(data => {
                        // Display user permissions or other details if needed
                    })
                    .catch(error => {
                        console.error('Error al cargar permisos del usuario:', error);
                    });
            }

            // Save configuration
            document.querySelector('.config-buttons .btn-save').addEventListener('click', function() {
                if (!currentUserId) {
                    showMessage('Seleccione un usuario primero');
                    return;
                }
                const config = {
                    id_usuario: currentUserId,
                    // Add other configuration details if needed
                };
                fetch('/configuracion', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                })
                .then(response => response.json())
                .then(data => {
                    showMessage('Configuración guardada correctamente');
                })
                .catch(error => {
                    console.error('Error al guardar configuración:', error);
                });
            });

            function showMessage(message) {
                messageBox.textContent = message;
                messageBox.style.display = 'block';
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 3000);
            }

            function toggleSidebar() {
                const sidebar = document.querySelector('.sidebar');
                const mainContent = document.querySelector('.main-content');
                const toggleBtn = document.querySelector('.toggle-btn i');
                const optionNames = document.querySelectorAll('.sidebar h2, .sidebar ul li a span');
                const icons = document.querySelectorAll('.sidebar ul li a i, .toggle-btn i');

                if (sidebar.classList.contains('collapsed')) {
                    optionNames.forEach(name => {
                        name.style.opacity = '0';
                    });
                    icons.forEach(icon => {
                        icon.style.opacity = '0';
                    });
                    setTimeout(() => {
                        sidebar.classList.remove('collapsed');
                        mainContent.classList.remove('collapsed');
                        toggleBtn.classList.remove('collapsed');
                        setTimeout(() => {
                            optionNames.forEach(name => {
                                name.style.display = 'inline';
                                setTimeout(() => {
                                    name.style.opacity = '1';
                                }, 10); // Small delay to trigger opacity transition
                            });
                            icons.forEach(icon => {
                                icon.style.opacity = '1';
                            });
                        }, 300); // Match the transition duration
                    }, 300); // Match the transition duration
                } else {
                    optionNames.forEach(name => {
                        name.style.opacity = '0';
                    });
                    icons.forEach(icon => {
                        icon.style.opacity = '0';
                    });
                    setTimeout(() => {
                        optionNames.forEach(name => {
                            name.style.display = 'none';
                        });
                        sidebar.classList.add('collapsed');
                        mainContent.classList.add('collapsed');
                        toggleBtn.classList.add('collapsed');
                        setTimeout(() => {
                            icons.forEach(icon => {
                                icon.style.opacity = '1';
                            });
                        }, 10); // Small delay to trigger opacity transition
                    }, 300); // Match the transition duration
                }
            }
        });
    </script>
</head>
<body>
    <div class="sidebar">
        <h2>Bienvenido usuario</h2>
        <ul>
            <li><a href="inicio.html"><i class="fas fa-home"></i>   Inicio</a></li>
            <li><a href="tareas.html"><i class="fas fa-tasks"></i>  Tareas</a></li>
            <li><a href="Registrarempleado.html"><i class="fas fa-users"></i>  Empleados</a></li>
            <li><a href="Configuracion.html"><i class="fas fa-cog"></i>  Configuración</a></li>
            <li><a href="Recordatorio.html"><i class="fas fa-bell"></i>  Recordatorios</a></li>
            <li class="Cerrarsesion"><a href="login.html"><i class="fas fa-sign-out"></i> Cerrar sesión</a></li>
        </ul>
        <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-chevron-left"></i></button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Configuración de Permisos de Usuario</h1>
        </div>

        <div class="config-container">
            <div class="config-sidebar">
                <ul>
                    <li><a href="#permissions">Permisos de Usuario</a></li>
                </ul>
            </div>

            <div class="config-content">
                <div id="permissions" class="config-section active">
                    <div class="user-actions">
                        <button class="btn-select"><i class="fas fa-check"></i> Seleccionar</button>
                        <i class="fas fa-edit"></i>
                        <i class="fas fa-trash-alt"></i>
                    </div>
                    <h2>Permisos de Usuario</h2>
                    <!-- User permissions or other details will be displayed here -->
                    <div class="user-list">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre de Usuario</th>
                                    <th>Contraseña</th>
                                    <th>Rol</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- User list will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="config-buttons">
                    <button class="btn btn-save">✔ Guardar cambios</button>
                    <button class="btn">❌ Cancelar</button>
                    <button class="btn">🔄 Restaurar valores predeterminados</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
