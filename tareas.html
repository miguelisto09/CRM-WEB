
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control del Gestor de Tareas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; 
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .task-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }
        .task-table th, .task-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        .task-table th {
            background-color: #3498db; 
            color: white;
        }
        .task-table tr:hover {
            background-color: #f1f1f1;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-family: 'Franklin Gothic Medium';
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            outline: none;
            color: #fff;
            background-color: #3498db; 
            border: none;
            border-radius: 5px; 
            margin: 5px; 
        }
        .btn:hover {background-color: #0056b3} 
        .btn:active {
            background-color: #0056b3;
            transform: translateY(4px);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #3498db;
            width: 80%;
            border-radius: 10px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .main-content {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .task-table-container {
            width: 100%;
            margin-left: 20px;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            text-align: center;
            transition: width 0.3s, padding 0.3s, opacity 0.3s; /* Unified transition duration */
        }

        .sidebar.collapsed {
            width: 60px;
            padding: 20px 10px;
        }
        .sidebar h2, .sidebar ul li a span {
            transition: opacity 0.3s, width 0.3s; /* Unified transition duration */
            opacity: 1;
            width: auto;
        }
        .sidebar.collapsed h2, .sidebar.collapsed ul li a span {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }
        .sidebar.collapsed ul li a {
            text-align: center;
            padding: 10px 0;
        }

        .sidebar.collapsed ul li a i {
            transition: opacity 0.3s; /* Add transition for icons */
            margin-right: 0;
        }

        .sidebar.collapsed .Cerrarsesion {
            width: 60px;
            text-align: center;
            padding: 10px 0;
        }
.sidebar h2 {
    margin: 0;
    font-size: 28px;
    text-align: center;
}

.sidebar ul {
    list-style: none;
    padding: 0;
    margin: 20px 0;
    padding-left: 0;
    text-align: left;
}

.sidebar ul li {
    margin: 10px 0;
    font-size: 18px;
}

.sidebar ul li a {
    text-decoration: none;
    color: white;
    display: block;
    padding: 10px;
    border-radius: 5px;
    transition: background-color 0.3s;
}

.sidebar ul li a:hover {
    background-color: #34495e;
}

.main-content {
    margin-left: 270px;
    padding: 20px;
}
.Cerrarsesion {
            position: fixed;
            bottom: 0;
            align-items: center;
            text-align: center;
            width: 250px;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 0 0 5px 5px;
            transition: background-color 0.3s, width 0.3s, padding 0.3s, opacity 0.3s; /* Unified transition duration */
        }
        .task-details {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .task-details-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            border-radius: 10px;
        }
        .task-details .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .task-details .close:hover,
        .task-details .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .comment-box {
            margin-top: 20px;
        }
        .comment-box textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .comment-box button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            outline: none;
            color: #fff;
            background-color: #007bff; 
            border: none;
            border-radius: 5px; 
            margin: 5px; 
        }
        .comment-box button:hover {background-color: #0056b3}
        .comment-box button:active {
            background-color: #0056b3;
            transform: translateY(4px);
        }
        .file-upload {
            margin-top: 20px;
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload label {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px; 
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            outline: none;
            color: #fff;
            background-color: #007bff; 
            border: none;
            border-radius: 5px; 
            margin: 5px; 
        }
        .file-upload label:hover {background-color: #0056b3} 
        .file-upload label:active {
            background-color: #0056b3;
            transform: translateY(4px);
        }
        .chart-container {
            width: 100%;
            margin: 20px 0;
        }
        tbody {
            font-family: 'Franklin Gothic Medium Cond';
        }
        table tbody td button {
            padding: 10px;
            background-color: #2c3e50;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            margin: 5px;
            width: 70px;
        }
        table tbody td button:hover {
            background-color: #34495e;
        }
        table tbody td button + button:hover {
            background-color: #c0392b;
        }
        .toggle-btn {
            position: absolute;
            top: 50%;
            right: -20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: right 0.3s, transform 0.3s; /* Unified transition duration */
            z-index: 1000; /* Ensure the button is always on top */
            transform: translateY(-50%);
        }

        .sidebar.collapsed .toggle-btn {
            right: -20px;
        }

        .toggle-btn i {
            transition: transform 0.3s; /* Unified transition duration */
        }
        .sidebar.collapsed .toggle-btn i {
            transform: rotate(180deg);
        }
        
        .sidebar.collapsed ~ .main-content {
    margin-left: 80px; 
    transition: margin-left 0.3s; 
}
.accesibilidad-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .menu-accesibilidad {
            position: fixed;
            top: 10%;
            right: 20px;
            background: white;
            width: 150px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .menu-accesibilidad button {
            width: 100%;
            height: 20%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            background: #f0f0f0;
        }
        .menu-accesibilidad button i {
            margin-right: 10px;
        }
        .alto-contraste {
            background-color: black;
            color: rgb(255, 255, 255);
        }
        .alto-contraste .task-table :hover {
            background-color: black;
            color: white;
        }
        .resaltar-enlaces a {
            background: rgb(255, 0, 0);
            color: black;
        }
        .ocultar-imagenes img {
            display: none;
        }
        .menu-accesibilidad header {
            font-size: 20px;
            margin-bottom: 10px;
            background-color: #2c3e50;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="sidebar" style="background-color: #2c3e50;">
        <h2>Bienvenido usuario</h2>
        <ul>
            <li><a href="inicio.html"><i class="fas fa-home"></i> <span>Inicio</span></a></li>
            <li><a href="Tareas.html"><i class="fas fa-tasks"></i> <span>Tareas</span></a></li>
            <li><a href="Registrarempleado.html"><i class="fas fa-users"></i> <span>Empleados</span></a></li>
            <li><a href="Configuracion.html"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
            <li><a href="Recordatorio.html"><i class="fas fa-bell"></i> <span>Recordatorios</span></a></li>
            <button class="accesibilidad-btn" onclick="toggleMenu()"><i class="fa-solid fa-universal-access"></i></button>
    <div class="menu-accesibilidad" id="menuAccesibilidad">
        <header>Accesibilidad</header>
        <button onclick="toggleContraste()"><i class="fa fa-adjust" aria-hidden="true"></i> Contraste</button>
        <button onclick="toggleResaltarEnlaces()"><i class="fa fa-link" aria-hidden="true"></i> Resaltar Enlaces</button>
        <button onclick="toggleTextoGrande()"><i class="fa fa-text-height"></i> Texto Grande</button>
        <button onclick="toggleEspaciadoTexto()"><i class="fa fa-text-width"></i> Espaciado de Texto</button>
        <button onclick="toggleAnimaciones()"><i class="fas fa-pause"></i> Pausar Animaciones</button>
        <button onclick="toggleOcultarImagenes()"><i class="fas fa-eye-slash"></i> Ocultar Imágenes</button>
    </div>
        </ul>
        <ul>
            <li class="Cerrarsesion"><a href="#" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i><span>Cerrar sesión</span></a></li>

        </ul>
         <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-chevron-left"></i></button>
    </div>
    <div class="main-content">
        <div class="task-table-container">
            <button class="btn" onclick="registrartarea()">Crear Tarea</button>
            <table class="task-table">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Asignado a</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Fecha de Vencimiento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                </tbody>
            </table>
            <div class="chart-container">
                <canvas id="taskChart"></canvas>
            </div>
        </div>
    </div>

    <div id="taskDetails" class="task-details">
        <div class="task-details-content">
            <span class="close" onclick="document.getElementById('taskDetails').style.display='none'">&times;</span>
            <h2 id="taskTitle"></h2>
            <p><strong>Descripción:</strong> <span id="taskDescription"></span></p>
            <p><strong>Asignado a:</strong> <span id="taskAssignedTo"></span></p>
            <p><strong>Prioridad:</strong> <span id="taskPriority"></span></p>
            <p><strong>Estado:</strong> <span id="taskStatus"></span></p>
            <p><strong>Fecha de Vencimiento:</strong> <span id="taskDueDate"></span></p>
            <div class="comment-box">
                <h3>Comentarios</h3>
                <div id="taskComments"></div>
                <textarea id="newComment" placeholder="Añadir un comentario..."></textarea>
                <button onclick="addComment()">Añadir Comentario</button>
            </div>
            <div class="file-upload">
                <label for="taskFilesDetails">Subir Documentos</label>
                <input type="file" id="taskFilesDetails" name="taskFilesDetails" multiple>
            </div>
            <button class="btn" style="background-color: green;" onclick="completeTask(currentTaskIndex)">Completar Tarea</button>
            <button class="btn" style="background-color: red;" onclick="cancelTask()">Cancelar Tarea</button>
            <button class="btn" style="background-color: blue;" onclick="editTask(currentTaskIndex)">Editar Tarea</button>
        </div>
    </div>
    <script>
        async function cargartarea() {
            try {
                const response = await fetch('http://localhost:4000/tarea');
                const tareas = await response.json();
                const tabla = document.getElementById('taskTableBody');
                tabla.innerHTML = '';
    
                tareas.forEach(tarea => {  
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${tarea.nombre_tarea}</td>
                        <td>${tarea.descripcion}</td>
                        <td>${tarea.nombre_encargado || 'No asignado'}</td> 
                        <td>${tarea.prioridad || 'N/A'}</td>
                        <td>${tarea.estado || 'N/A'}</td>
                        <td>${new Date(tarea.fecha_limite).toISOString().split('T')[0]}</td>
                        <td>
                            <button onclick="editartarea(${tarea.id_tarea})">Editar</button>
                            <button onclick="eliminartarea(${tarea.id_tarea})">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar tareas:', error);
            }
        }
        function editartarea(id) {
    window.location.href = `editartarea.html?id=${id}`;
 }
 async function eliminartarea(id) {
    if (confirm('¿Estás seguro de eliminar esta tarea?')) {
        try {
            await fetch(`http://localhost:4000/tarea/${id}`, { method: 'DELETE' });
            cargartarea();
        } catch (error) {
            console.error('Error al eliminar tarea:', error);
        }
    }
}
function registrartarea() {
    window.location.href = `registrartarea.html`;
}
function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.querySelector('.toggle-btn i');
            const optionNames = document.querySelectorAll('.sidebar h2, .sidebar ul li a span');
            const icons = document.querySelectorAll('.sidebar ul li a i, .toggle-btn i');

            if (sidebar.classList.contains('collapsed')) {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    sidebar.classList.remove('collapsed');
                    mainContent.classList.remove('collapsed');
                    toggleBtn.classList.remove('collapsed');
                    setTimeout(() => {
                        optionNames.forEach(name => {
                            name.style.display = 'inline';
                            setTimeout(() => {
                                name.style.opacity = '1';
                            }, 10); // Small delay to trigger opacity transition
                        });
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 300); // Match the transition duration
                }, 300); // Match the transition duration
            } else {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    optionNames.forEach(name => {
                        name.style.display = 'none';
                    });
                    sidebar.classList.add('collapsed');
                    mainContent.classList.add('collapsed');
                    toggleBtn.classList.add('collapsed');
                    setTimeout(() => {
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 10); 
                }, 300); 
            }
        }
        function cerrarSesion() {
    sessionStorage.clear();
    localStorage.clear();

    window.location.href = "login.html";

    setTimeout(() => {
        history.pushState(null, null, "login.html");
        window.onpopstate = function () {
            history.go(1);
        };
    }, 0);
}
function toggleMenu() {
            let menu = document.getElementById('menuAccesibilidad');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        function toggleContraste() {
            document.body.classList.toggle('alto-contraste');
        }
        function toggleResaltarEnlaces() {
            document.body.classList.toggle('resaltar-enlaces');
        }
        function toggleTextoGrande() {
            document.body.style.fontSize = document.body.style.fontSize === '1.5em' ? '' : '1.5em';
        }
        function toggleEspaciadoTexto() {
            document.body.style.letterSpacing = document.body.style.letterSpacing === '2px' ? '' : '2px';
        }
        function toggleAnimaciones() {
            let style = document.createElement('style');
            style.innerHTML = '* { animation: none !important; transition: none !important; }';
            document.head.appendChild(style);
        }
        function toggleOcultarImagenes() {
            document.body.classList.toggle('ocultar-imagenes');
        }
        document.addEventListener('DOMContentLoaded', cargartarea);
    </script>
</body>
</html>
