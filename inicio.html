<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Dashboard</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <div class="sidebar">
            <h2>Bienvenido usuario</h2>
            <ul>
                <li><a href="inicio.html"><i class="fas fa-home"></i> <span>Inicio</span></a></li>
                <li><a href="Tareas.html"><i class="fas fa-tasks"></i> <span>Tareas</span></a></li>
                <li><a href="Registrarempleado.html"><i class="fas fa-users"></i> <span>Empleados</span></a></li>
                <li><a href="Configuracion.html"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
                <li><a href="Recordatorio.html"><i class="fas fa-bell"></i> <span>Recordatorios</span></a></li>
            </ul>
            <ul>
                <li class="Cerrarsesion"><a href="#" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i><span>Cerrar sesión</span></a></li>
            </ul>
             <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-chevron-left"></i></button>
        </div>

    <div class="main-content">
        <div class="header">
            <h1>Resumen General</h1>
            <div class="quick-actions">
                <button onclick="location.href='registrarempleadoo.html'">+ Nuevo Empleado</button>
                <button onclick="location.href='Tareas.html'">+ Nueva Tarea</button>
                <button onclick="location.href='Recordatorio.html'">+ Nuevo Recordatorio</button>
            </div>
        </div>

        <div class="widgets">
            <div class="widget cumpleanos">
                <h3>Próximos cumpleaños</h3>
                <div id="lista-cumpleanos">
                    <p>Cargando...</p>
                </div>
            </div>

            <div class="widget">
                <h3>Tareas pendientes</h3>
                <div id="lista-tareas">
                    <p>Cargando...</p>
                </div>
            </div>
            <div class="widget">
                <h3>Tareas atrasadas</h3>
                <div id="lista-tareas-atrasadas">
                    <p>Cargando...</p>
                </div>
            </div>

            <div class="widget">
                <h3>Estadísticas de Tareas</h3>
                <canvas id="graficoTareas"></canvas> 
            </div>
        </div>
    </div>

    <script>

        document.addEventListener("DOMContentLoaded", async () => {
            cargarCumpleanos();
            cargarTareasPendientes();
            cargarTareasAtrasadas();
        });

        async function cargarCumpleanos() {
            const listaCumpleanos = document.getElementById("lista-cumpleanos");

            try {
                const response = await fetch("http://localhost:4000/cumpleanos");
                const empleados = await response.json();

                listaCumpleanos.innerHTML = ""; 

                if (empleados.length === 0) {
                    listaCumpleanos.innerHTML = "<p>No hay cumpleaños próximos.</p>";
                } else {
                    empleados.forEach(empleado => {
                        const div = document.createElement("div");
                        div.classList.add("list-item");
                        div.innerHTML = `<strong>${empleado.nombre} ${empleado.apellido}</strong> - 🎂 ${formatFecha(empleado.fecha_nacimiento)}`;
                        listaCumpleanos.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("Error al cargar los cumpleaños:", error);
                listaCumpleanos.innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        async function cargarTareasPendientes() {
            const listaTareas = document.getElementById("lista-tareas");

            try {
                const response = await fetch("http://localhost:4000/tareas-pendientes");
                const tareas = await response.json();

                listaTareas.innerHTML = ""; 

                if (tareas.length === 0) {
                    listaTareas.innerHTML = "<p>No hay tareas pendientes.</p>";
                } else {
                    tareas.forEach(tarea => {
                        const div = document.createElement("div");
                        div.classList.add("list-item");
                        div.innerHTML = `<strong>${tarea.nombre_tarea}</strong> - Prioridad: ${tarea.prioridad} - ⏳ Fecha límite: ${formatFecha(tarea.fecha_limite)}`;
                        listaTareas.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("Error al cargar las tareas pendientes:", error);
                listaTareas.innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        async function cargarTareasAtrasadas() {
            const listaTareasAtrasadas = document.getElementById("lista-tareas-atrasadas");

            try {
                const response = await fetch("http://localhost:4000/tareas-atrasadas");
                const tareasatrasadas = await response.json();

                listaTareasAtrasadas.innerHTML = ""; 

                if (tareasatrasadas.length === 0) {
                    listaTareasAtrasadas.innerHTML = "<p>No hay tareas atrasadas.</p>";
                } else {
                    tareasatrasadas.forEach(tarea => {
                        const div = document.createElement("div");
                        div.classList.add("list-item");
                        div.innerHTML = `<strong>${tarea.nombre_tarea}</strong> - Prioridad: ${tarea.prioridad} - ⏳ Fecha límite: ${formatFecha(tarea.fecha_limite)}`;
                        listaTareasAtrasadas.appendChild(div);
                    });
                }
            } 
            catch (error) {
                console.error("Error al cargar las tareas atrasadas:", error);
                listaTareasAtrasadas.innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        function formatFecha(fecha) {
            const opciones = { day: "2-digit", month: "long" };
            return new Date(fecha).toLocaleDateString("es-ES", opciones);
        }

        document.addEventListener("DOMContentLoaded", function () {
            fetch("http://localhost:4000/estadisticas-tareas")
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById("graficoTareas").getContext("2d");

                new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: ["Pendientes", "Atrasadas", "Realizadas"],
                        datasets: [{
                            data: [data.pendientes, data.atrasadas, data.realizadas],
                            backgroundColor: ["#f39c12", "#e74c3c", "#2ecc71"]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: "bottom"
                            }
                        }
                    }
                });
            })
            .catch(error => console.error("Error al cargar estadísticas:", error));
        });
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.querySelector('.toggle-btn i');
            const optionNames = document.querySelectorAll('.sidebar h2, .sidebar ul li a span');
            const icons = document.querySelectorAll('.sidebar ul li a i, .toggle-btn i');

            if (sidebar.classList.contains('collapsed')) {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    sidebar.classList.remove('collapsed');
                    mainContent.classList.remove('collapsed');
                    toggleBtn.classList.remove('collapsed');
                    setTimeout(() => {
                        optionNames.forEach(name => {
                            name.style.display = 'inline';
                            setTimeout(() => {
                                name.style.opacity = '1';
                            }, 10); // Small delay to trigger opacity transition
                        });
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 300); // Match the transition duration
                }, 300); // Match the transition duration
            } else {
                optionNames.forEach(name => {
                    name.style.opacity = '0';
                });
                icons.forEach(icon => {
                    icon.style.opacity = '0';
                });
                setTimeout(() => {
                    optionNames.forEach(name => {
                        name.style.display = 'none';
                    });
                    sidebar.classList.add('collapsed');
                    mainContent.classList.add('collapsed');
                    toggleBtn.classList.add('collapsed');
                    setTimeout(() => {
                        icons.forEach(icon => {
                            icon.style.opacity = '1';
                        });
                    }, 10); 
                }, 300); 
            }
        }
        function cerrarSesion() {
    sessionStorage.clear();
    localStorage.clear();

    window.location.href = "login.html";

    setTimeout(() => {
        history.pushState(null, null, "login.html");
        window.onpopstate = function () {
            history.go(1);
        };
    }, 0);
}

    </script>
</body>
</html>
